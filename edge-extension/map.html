<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #mkp-mapper-header {
            height: 45px;
            position: relative;
            z-index: 1600;
            background: #354c80;
            color: #efefef;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            font-size: 20px;
            font-weight: bold;
            user-select: none;
        }

        #mkp-mapper-title {
            font-size: 1.5rem;
            cursor: grab;
            text-align: center;
        }

        #mkp-mapper-drag-handle:active {
            cursor: grabbing;
        }

        #mkp-mapper-drag-handle {
            color: #efefef;
            border: none;
            font-size: 1.5rem !important;
            padding: 8px;
            font-size: 14px;
            cursor: grab;
            border-radius: .5rem;
            margin-right: 1.4rem;
        }

        #mkp-mapper-drag-handle:active {
            cursor: grabbing;
        }

        #mpk-mapper-controls {
            display: flex;
            flex-direction: row;
            justify-content: end;
        }

        #mkp-mapper-close-map,
        #mkp-mapper-minimize-map {
            color: #efefef;
            background: #354c80;
            border: none;
            padding: 0 8px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold !important;
            border-radius: .5rem !important;
        }

        #mkp-mapper-minimize-map {
            font-size: 1.7rem;
        }

        #mkp-mapper-close-map:hover,
        #mkp-mapper-minimize-map:hover {
            background: #293b64 !important;
        }

        #mkp-mapper-map {
            flex: 1;
            position: relative;
        }

        /* -----------------------------
           Fast custom tooltips (replace slow native title=)
        ----------------------------- */
        [data-tooltip] {
            position: relative;
        }

        [data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2b4d;
            color: #fff;
            font-size: .68rem;
            font-weight: normal;
            font-style: normal;
            line-height: 1.3;
            padding: 4px 8px;
            border-radius: 5px;
            width: max-content;
            max-width: min(190px, calc(100vw - 16px));
            white-space: normal;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .15s ease .12s, visibility 0s linear .12s;
            z-index: 3000;
        }

        [data-tooltip]:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* While a button's popover is open its tooltip would sit on top of it */
        [data-tt-off]::after {
            display: none;
        }

        .tt-up::after {
            bottom: calc(100% + 7px);
        }

        .tt-down::after {
            top: calc(100% + 7px);
        }

        .tt-left::after {
            left: 0;
            transform: none;
        }

        .tt-right::after {
            left: auto;
            right: 0;
            transform: none;
        }

        #mkp-mapper-drag-wrap {
            display: inline-flex;
            align-items: center;
        }

        /* -----------------------------
           Auto-load progress spinner
        ----------------------------- */
        #mkp-autoload-spinner {
            display: none;
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, .95);
            color: #354c80;
            font-size: .8rem;
            font-weight: bold;
            padding: 7px 14px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
            z-index: 1100;
            pointer-events: none;
        }

        .mkp-autoload-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Progress track: the sweep is time-boxed, so show how far along it is */
        .mkp-autoload-track {
            width: 100%;
            height: 3px;
            border-radius: 999px;
            background: #dbe3f5;
            overflow: hidden;
        }

        #mkp-autoload-bar {
            width: 0%;
            height: 100%;
            background: #354c80;
            border-radius: 999px;
            transition: width .3s ease;
        }

        .mkp-autoload-hint {
            font-size: .62rem;
            font-weight: normal;
            color: #6a7799;
        }

        /* -----------------------------
           Draw-an-area filter
        ----------------------------- */
        .mkp-drawing {
            cursor: crosshair !important;
        }

        .mkp-drawing .leaflet-marker-icon {
            pointer-events: none;
        }

        #mkp-area-hint {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(53, 76, 128, .94);
            color: #fff;
            font-size: .7rem;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
            z-index: 1100;
            pointer-events: none;
        }

        /* -----------------------------
           Scraper health banner
        ----------------------------- */
        #mkp-health {
            display: none;
            align-items: center;
            gap: 8px;
            background: #fff4e5;
            color: #7a4b00;
            border-bottom: 1px solid #f0d9b5;
            font-size: .68rem;
            line-height: 1.3;
            padding: 5px 8px;
        }

        #mkp-health a {
            color: #7a4b00;
            font-weight: bold;
            white-space: nowrap;
        }

        /* "New since your last visit" markers and popup chip */
        .mkp-pin-new {
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #e5484d;
        }

        .mkp-new-chip {
            align-self: flex-start;
            background: #e5484d;
            color: #fff;
            font-size: .6rem;
            font-weight: bold;
            letter-spacing: .02em;
            padding: 1px 5px;
            border-radius: 4px;
            margin-bottom: .25rem;
        }

        .mkp-spinner-ring {
            width: 14px;
            height: 14px;
            border: 2px solid #c9d4ee;
            border-top-color: #354c80;
            border-radius: 50%;
            animation: mkp-spin .8s linear infinite;
        }

        @keyframes mkp-spin {
            to {
                transform: rotate(360deg);
            }
        }

        #mkp-mapper-footer {
            background: #354c80;
            color: #efefef;
        }

        #mkp-mapper-footer p {
            margin: .15rem .3rem;
            font-size: .7rem;
        }

        #mkp-mapper-footer #mkp-scroll-hint {
            color: #ffc472;
            /* font-weight: bold; */
        }

        #mkp-mapper-footer #mkp-scroll-contact {
            font-size: .6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #mkp-mapper-footer a {
            color: #ffc472;
        }

        /* -----------------------------
           Tools row (compact icon switches)
        ----------------------------- */
        #mkp-mapper-tools {
            position: relative;
            z-index: 1600;
            background: #354c80;
            color: #efefef;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            border-top: 1px solid #2b3f6b;
        }

        .mkp-tool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            padding: 0;
            background: transparent;
            color: #cdd6ee;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .mkp-tool-btn:hover {
            background: #2b3f6b;
            color: #fff;
        }

        .mkp-tool-btn.active {
            background: #ffc472;
            color: #354c80;
        }

        .mkp-tool-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Unread-style count on the "new since last visit" switch */
        .mkp-tool-btn {
            position: relative;
        }

        .mkp-tool-btn.has-new::before {
            content: attr(data-count);
            position: absolute;
            top: -1px;
            right: -1px;
            min-width: 14px;
            height: 14px;
            padding: 0 3px;
            box-sizing: border-box;
            background: #e5484d;
            color: #fff;
            font-size: .55rem;
            font-weight: bold;
            line-height: 14px;
            text-align: center;
            border-radius: 999px;
            pointer-events: none;
        }

        .mkp-tool-sep {
            width: 1px;
            height: 18px;
            background: #2b3f6b;
            margin: 0 2px;
        }

        /* Price range popover */
        #mkp-price-panel {
            display: none;
            position: absolute;
            bottom: 40px;
            right: 6px;
            background: #fff;
            color: #333;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .35);
            padding: 10px;
            z-index: 1200;
            font-size: .75rem;
        }

        #mkp-price-panel .mkp-price-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        #mkp-price-panel .mkp-price-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        #mkp-price-panel input {
            width: 72px;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: .75rem;
        }

        #mkp-price-clear {
            margin-top: 8px;
            background: #354c80;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: .7rem;
        }

        /* Home region popover */
        #mkp-home-panel {
            display: none;
            position: absolute;
            bottom: 40px;
            right: 6px;
            width: 210px;
            background: #fff;
            color: #333;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .35);
            padding: 10px;
            z-index: 1200;
            font-size: .75rem;
        }

        #mkp-home-panel .mkp-home-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        #mkp-home-panel input {
            width: 100%;
            box-sizing: border-box;
            padding: 5px 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: .75rem;
        }

        #mkp-home-panel .mkp-home-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        #mkp-home-panel button {
            background: #354c80;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: .7rem;
        }

        #mkp-home-panel #mkp-home-clear {
            background: #e6e8ee;
            color: #354c80;
        }

        #mkp-home-status {
            display: block;
            margin-top: 7px;
            color: #6a7799;
            font-size: .66rem;
            line-height: 1.3;
        }

        /* Colored map pins */
        .mkp-pin-wrap {
            background: transparent;
            border: none;
        }

        .mkp-pin {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .45);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 11px;
            line-height: 1;
        }
    </style>
</head>

<body>
    <div id="mkp-mapper-header">
        <span id="mkp-mapper-drag-wrap" class="tt-down tt-left" data-tt-fixed="true" data-tooltip="Drag to move the map">
        <svg id="mkp-mapper-drag-handle" xmlns="http://www.w3.org/2000/svg" width="20px" height="20px"
            viewBox="0 0 24 24" fill="#fff">
            <path
                d="M16.1924 5.65683C16.5829 5.2663 16.5829 4.63314 16.1924 4.24261L13.364 1.41419C12.5829 0.633139 11.3166 0.633137 10.5355 1.41419L7.70711 4.24261C7.31658 4.63314 7.31658 5.2663 7.70711 5.65683C8.09763 6.04735 8.73079 6.04735 9.12132 5.65683L11 3.77812V11.0503H3.72784L5.60655 9.17157C5.99707 8.78104 5.99707 8.14788 5.60655 7.75735C5.21602 7.36683 4.58286 7.36683 4.19234 7.75735L1.36391 10.5858C0.582863 11.3668 0.582859 12.6332 1.36391 13.4142L4.19234 16.2426C4.58286 16.6332 5.21603 16.6332 5.60655 16.2426C5.99707 15.8521 5.99707 15.219 5.60655 14.8284L3.8284 13.0503H11V20.2219L9.12132 18.3432C8.73079 17.9526 8.09763 17.9526 7.7071 18.3432C7.31658 18.7337 7.31658 19.3669 7.7071 19.7574L10.5355 22.5858C11.3166 23.3669 12.5829 23.3669 13.364 22.5858L16.1924 19.7574C16.5829 19.3669 16.5829 18.7337 16.1924 18.3432C15.8019 17.9526 15.1687 17.9526 14.7782 18.3432L13 20.1213V13.0503H20.071L18.2929 14.8284C17.9024 15.219 17.9024 15.8521 18.2929 16.2426C18.6834 16.6332 19.3166 16.6332 19.7071 16.2426L22.5355 13.4142C23.3166 12.6332 23.3166 11.3668 22.5355 10.5858L19.7071 7.75735C19.3166 7.36683 18.6834 7.36683 18.2929 7.75735C17.9024 8.14788 17.9024 8.78104 18.2929 9.17157L20.1716 11.0503H13V3.87867L14.7782 5.65683C15.1687 6.04735 15.8019 6.04735 16.1924 5.65683Z"
                fill="#fff" />
        </svg>
        </span>
        <h1 id="mkp-mapper-title">MKP Map</h1>
        <div id="mpk-mapper-controls">
            <button id="mkp-mapper-minimize-map" class="tt-down tt-right" data-tt-fixed="true" data-tooltip="Minimize">–</button>
            <button id="mkp-mapper-close-map" class="tt-down tt-right" data-tt-fixed="true" data-tooltip="Close the map">X</button>
        </div>
    </div>
    <div id="mkp-health"></div>
    <div id="mkp-mapper-map">
        <div id="mkp-area-hint"></div>
        <div id="mkp-autoload-spinner">
            <div class="mkp-autoload-row">
                <span class="mkp-spinner-ring"></span>
                Loading listings&hellip;
            </div>
            <div class="mkp-autoload-track">
                <div id="mkp-autoload-bar"></div>
            </div>
            <span class="mkp-autoload-hint">Scroll to stop</span>
        </div>
        <div id="map-loading" style="
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%);
        background:rgba(255,255,255,0.9);
        padding:10px 20px;
        border-radius:6px;
        z-index:1000;
        font-weight:bold;
        font-size:16px;
        text-align:center;
        ">
            Loading location...
        </div>
    </div>
    <div id="mkp-mapper-tools">
        <button class="mkp-tool-btn tt-up" id="mkp-tool-autoload"
            data-tooltip="Auto-load listings: scroll the page to pull more listings onto the map">
            <svg viewBox="0 0 24 24">
                <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z" />
            </svg>
        </button>

        <button class="mkp-tool-btn tt-up" id="mkp-tool-new"
            data-tooltip="Show only listings new since your last visit">
            <!-- Sparkles: deliberately unlike the bookmark star next to it -->
            <svg viewBox="0 0 24 24">
                <path d="M10 3l1.5 4.3L16 9l-4.5 1.7L10 15l-1.5-4.3L4 9l4.5-1.7z" />
                <path d="M17.5 13l.8 2.4 2.2.9-2.2.9-.8 2.3-.8-2.3-2.2-.9 2.2-.9z" />
            </svg>
        </button>

        <button class="mkp-tool-btn tt-up" id="mkp-tool-area"
            data-tooltip="Draw an area on the map to show only listings inside it">
            <svg viewBox="0 0 24 24">
                <path
                    d="M17.66 3.34a2 2 0 0 0-2.83 0l-1.1 1.1-1.44-1.44a1 1 0 0 0-1.41 1.41l1.43 1.44-6.4 6.4a3 3 0 0 0-.83 1.62l-.6 3.3a1 1 0 0 0 1.17 1.16l3.3-.6a3 3 0 0 0 1.61-.83l6.4-6.4 1.44 1.44a1 1 0 0 0 1.41-1.42l-1.43-1.43 1.1-1.1a2 2 0 0 0 0-2.83zM4 20a1 1 0 0 0 0 2h16a1 1 0 0 0 0-2z" />
            </svg>
        </button>

        <span class="mkp-tool-sep"></span>

        <button class="mkp-tool-btn tt-up" id="mkp-tool-bookmarks" data-tooltip="Show bookmarked listings only">
            <svg viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
            </svg>
        </button>

        <button class="mkp-tool-btn tt-up" id="mkp-tool-free" data-tooltip="Show free items only">
            <svg viewBox="0 0 24 24">
                <path
                    d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41s-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z" />
            </svg>
        </button>

        <button class="mkp-tool-btn tt-up" id="mkp-tool-price" data-tooltip="Filter by price range">
            <svg viewBox="0 0 24 24">
                <path
                    d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z" />
            </svg>
        </button>

        <span class="mkp-tool-sep"></span>

        <button class="mkp-tool-btn tt-up" id="mkp-tool-color"
            data-tooltip="Color pins by freshness — green: free, orange: just listed, gold: saved">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
            </svg>
        </button>

        <button class="mkp-tool-btn tt-up" id="mkp-tool-home"
            data-tooltip="Set your region — fixes listings placed in the wrong country">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" />
            </svg>
        </button>

        <div id="mkp-home-panel">
            <div class="mkp-home-title">Your region</div>
            <input type="text" id="mkp-home-input" placeholder="e.g. Montreal, QC" autocomplete="off">
            <div class="mkp-home-row">
                <button id="mkp-home-apply" type="button">Save</button>
                <button id="mkp-home-clear" type="button">Auto</button>
            </div>
            <span id="mkp-home-status"></span>
        </div>

        <div id="mkp-price-panel">
            <div class="mkp-price-title">Price range</div>
            <div class="mkp-price-row">
                <input type="number" id="mkp-price-min" placeholder="Min" min="0" inputmode="numeric">
                <span>–</span>
                <input type="number" id="mkp-price-max" placeholder="Max" min="0" inputmode="numeric">
            </div>
            <button id="mkp-price-clear">Clear</button>
        </div>
    </div>
    <div id="mkp-mapper-footer">
        <p id="mkp-scroll-hint">↕ Scroll the page to load more listings onto the map.</p>
        <p id="mkp-scroll-contact">
            <span>Approximate locations</span>
            <a href="https://www.refactorednews.com/author" target="_blank">Contact the creator</a>
        </p>
    </div>

    <script src="leaflet/leaflet.js"></script>
    <script src="pako.min.js"></script>
    <script src="map.js"></script>
    <script src="header.js"></script>
</body>

</html>
